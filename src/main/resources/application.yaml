spring:
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catering}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
    drop-first: false

box:
  min-items: 5
  max-items: 6

sms:
  provider: log
  payment-reminder-after-hours: 24

business:
  name: ${BUSINESS_NAME:Catering}
  payment-info: ${PAYMENT_INFO:BLIK na telefon lub przelew, dane przekaze wlasciciel}
